root = "."
tmp_dir = "tmp"

[build]
cmd = "CGO_ENABLED=0 go build -o /tmp/servergram-agent . && ../scripts/build-agent-to-server.sh"
entrypoint = [ "../scripts/run-agent.sh"]
include_dir = ["internal", "../shared/proto"]
include_ext = ["go", "proto"]
exclude_regex = ["_test\\.go$"]
send_interrupt = true
kill_delay = "500ms"
stop_on_error = true
