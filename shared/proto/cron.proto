syntax = "proto3";

package proto;

option go_package = "hazyio.com/servergram/shared/proto;proto";

message Cron {
  string hash = 1;
  string name = 2;
  bool managed = 3;
  string status = 4;
  uint64 id = 5;
  string last_run_at = 6;
  string next_run_at = 7;
  string schedule = 8;
  string command = 9;
}

message ListCronJobsRequest {}

message ListCronJobsResponse {
  repeated Cron jobs = 1;
  bool done = 2;
}
message CreateCronJobRequest {
  string name = 1;
  string schedule = 2;
  string command = 3;
  int32 meta_keep_count = 4;
  int32 run_logs_keep_count = 5;
  int32 error_logs_keep_days = 6;
  bool wrap = 7;
}

message CreateCronJobResponse {}

message RemoveDuplicateCronJobsRequest {}

message RemoveDuplicateCronJobsResponse {
  uint32 removed = 1;
}

message FixUnmanagedCronJobsRequest {}

message FixUnmanagedCronJobsResponse {
  uint32 fixed = 1;
}
message RunCronJobRequest {
  uint64 id = 1;
}

message RunCronJobResponse {}

message StopCronJobRequest {
  uint64 id = 1;
}

message StopCronJobResponse {}
message CronInfoRequest {
  uint64 id = 1;
}

message CronInfoResponse {
  string name = 1;
  bool managed = 2;
  uint64 id = 3;
  string schedule = 4;
  string command = 5;
  int32 meta_keep_count = 6;
  int32 run_logs_keep_count = 7;
  int32 error_logs_keep_days = 8;
  string status = 9;
}
message UpdateCronJobRequest {
  uint64 id = 1;
  string name = 2;
  string schedule = 3;
  string command = 4;
  int32 meta_keep_count = 5;
  int32 run_logs_keep_count = 6;
  int32 error_logs_keep_days = 7;
  bool wrap = 8;
}
message UpdateCronJobResponse {}

message DeleteCronJobRequest {
  uint64 id = 1;
}

message DeleteCronJobResponse {}

service CronService {
  rpc ListCronJobs(ListCronJobsRequest) returns (stream ListCronJobsResponse);
  rpc CreateCronJob(CreateCronJobRequest) returns (CreateCronJobResponse);
  rpc RemoveDuplicateCronJobs(RemoveDuplicateCronJobsRequest) returns (RemoveDuplicateCronJobsResponse);
  rpc FixUnmanagedCronJobs(FixUnmanagedCronJobsRequest) returns (FixUnmanagedCronJobsResponse);
  rpc RunCronJob(RunCronJobRequest) returns (RunCronJobResponse);
  rpc StopCronJob(StopCronJobRequest) returns (StopCronJobResponse);
  rpc CronInfo(CronInfoRequest) returns (CronInfoResponse);
  rpc UpdateCronJob(UpdateCronJobRequest) returns (UpdateCronJobResponse);
  rpc DeleteCronJob(DeleteCronJobRequest) returns (DeleteCronJobResponse);
}
