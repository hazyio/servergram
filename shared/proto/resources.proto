syntax = "proto3";

package proto;

import "google/protobuf/empty.proto";

option go_package = "hazyio.com/servergram/shared/proto;proto";

message ServerUsageItem {
  uint64 usage = 1;
  uint64 total = 2;
  uint64 available = 3;
  uint32 percent = 4;
}

message ServerCPUUsage {
  double usage = 1;
  int32 cores = 2;
  int32 threads = 3;
}
message GetServerResourcesRequest {
  uint32 interval_ms = 3;
}
message GetServerResourcesResponse {
  ServerCPUUsage cpu = 1;
  ServerUsageItem memory = 2;
  ServerUsageItem disk = 3;
  ServerUsageItem swap = 4;
}

message GetServerInfoResponse {
  string os = 1;
  string architecture = 2;
  string kernel_version = 3;
  string hostname = 4;
  int64 uptime = 5;
  string platform = 6;
  string cpu_model = 7;
  string system_time = 8;
}

message TopProcessResponse {
  message Item {
    int32 pid = 1;
    string name = 2;
    double cpu_usage = 3;
    uint64 memory_usage = 4;
  }
  repeated Item items = 1;
}
enum TopProcessSortBy {
  CPU_USAGE = 0;
  MEMORY_USAGE = 1;
}
message TopProcessRequest {
  TopProcessSortBy sort_by = 1;
  uint32 limit = 2;
  uint32 interval_ms = 3;
}

message WatchProcessesRequest {
  uint32 interval_ms = 2;
  enum WatchProcessesColumns {
    WATCH_PROCESSES_COLUMNS_UNSPECIFIED = 0;
    WATCH_PROCESSES_COLUMNS_MEMORY = 1;
    WATCH_PROCESSES_COLUMNS_COMMAND = 2;
    WATCH_PROCESSES_COLUMNS_USER = 3;
    WATCH_PROCESSES_COLUMNS_CPU = 4;
    WATCH_PROCESSES_COLUMNS_STATE = 5;
    WATCH_PROCESSES_COLUMNS_UPTIME = 6;
  }
  repeated WatchProcessesColumns columns = 3;
}
message WatchProcessesResponse {
  enum WatchProcessesStatus {
    WATCH_PROCESSES_STATUS_UNSPECIFIED = 0;
    WATCH_PROCESSES_STATUS_SLEEPING = 1;
    WATCH_PROCESSES_STATUS_STOPPED = 2;
    WATCH_PROCESSES_STATUS_ZOMBIE = 3;
    WATCH_PROCESSES_STATUS_IDLE = 4;
    WATCH_PROCESSES_STATUS_WAITING = 5;
    WATCH_PROCESSES_STATUS_RUNNING = 6;
    WATCH_PROCESSES_STATUS_OTHER = 7;
  }
  message Item {
    int32 ppid = 1;
    int32 pid = 2;
    string name = 3;
    double cpu_usage = 4;
    uint64 memory_usage = 5;
    string command = 6;
    string username = 7;
    WatchProcessesStatus status = 8;
    uint64 uptime = 9;
  }
  repeated Item items = 1;
}
message StopProcessRequest {
  int32 pid = 1;
}
message StopProcessResponse {
  bool success = 1;
}
message ForceStopProcessRequest {
  int32 pid = 1;
}
message ForceStopProcessResponse {
  bool success = 1;
}
message SignalProcessRequest {
  enum SignalProcessRequestSignals {
    SIGNAL_PROCESS_REQUEST_SIGNALS_UNSPECIFIED = 0;
    SIGNAL_PROCESS_REQUEST_SIGNALS_HUP = 1; // reload config
    SIGNAL_PROCESS_REQUEST_SIGNALS_INT = 2; // like Ctrl+C
    SIGNAL_PROCESS_REQUEST_SIGNALS_KILL = 3; // uncatchable
    SIGNAL_PROCESS_REQUEST_SIGNALS_TERM = 4; // graceful stop
    SIGNAL_PROCESS_REQUEST_SIGNALS_QUIT = 5; // quit + core dump
    SIGNAL_PROCESS_REQUEST_SIGNALS_USR1 = 6; // app-defined
    SIGNAL_PROCESS_REQUEST_SIGNALS_USR2 = 7; // app-defined
    SIGNAL_PROCESS_REQUEST_SIGNALS_STOP = 8; // pause, uncatchable
    SIGNAL_PROCESS_REQUEST_SIGNALS_CONT = 9; // resume
    SIGNAL_PROCESS_REQUEST_SIGNALS_TSTP = 10; // pause, catchable (Ctrl+Z)
    SIGNAL_PROCESS_REQUEST_SIGNALS_ALRM = 11;
    SIGNAL_PROCESS_REQUEST_SIGNALS_ABORT = 12; // abort
  }
  int32 pid = 1;
  SignalProcessRequestSignals signal = 2;
}
message SignalProcessResponse {
  bool success = 1;
}

service ResourcesService {
  rpc Get(GetServerResourcesRequest) returns (stream GetServerResourcesResponse);
  rpc Info(google.protobuf.Empty) returns (GetServerInfoResponse);
  rpc TopProcesses(TopProcessRequest) returns (stream TopProcessResponse);
  rpc WatchProcesses(WatchProcessesRequest) returns (stream WatchProcessesResponse);
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);
  rpc ForceStopProcess(ForceStopProcessRequest) returns (ForceStopProcessResponse);
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
}
